# Local stack: Postgres (db) and the API plus frontend (app) on http://127.0.0.1:8000.
#   docker compose up -d --build   build and start both (reads .env)
#   docker compose down        stop it; data stays in the ehr-rwe-eln-pg18 volume
#   docker compose down -v     stop it and delete the data
services:
  db:
    # PostgreSQL 18 with pgvector 0.8.7. Pinned exactly; bump deliberately. A new major version
    # cannot read the old one's data, so a bump also needs a new volume.
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_DB: ehr_rwe_eln
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    # Localhost only: nothing off this machine can reach the database.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images keep data in /var/lib/postgresql/18/docker, so mount the parent.
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ehr_rwe_eln"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    env_file: .env
    environment:
      # Inside Compose the database is the db service, not localhost.
      DB_HOST: db
      DB_PORT: 5432
    # Localhost only, like the database. No auth, so never expose this port.
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    # The slim image has no curl, so probe with Python.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Scheduled privacy checks on the synthetic releases (ehr_rwe_eln.synth.monitor): every
  # MONITOR_INTERVAL_HOURS it reruns the attacks if a source or the synth code changed, and
  # records each run in synth.monitor_run. Same image as the app, no ports.
  monitor:
    build: .
    command: ["python", "-m", "ehr_rwe_eln.synth.monitor"]
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      # The container has no AWS credentials, so it reads OMOP from the staging Postgres until
      # it moves to ECS (AWS step 4).
      OMOP_SOURCE: staging
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Hail, for the synthetic genotyping study. Off by default (a profile); run it with
  #   docker compose run --rm --build hail
  # after scripts/generate_genomics.py. No network ports; it reads and writes data/genomics.
  hail:
    profiles: ["genomics"]
    build:
      context: .
      dockerfile: docker/hail.Dockerfile
    volumes:
      - ./data/genomics:/work/data/genomics
      - ./scripts/hail_gwas.py:/work/scripts/hail_gwas.py:ro

  # OHDSI HADES (R): runs on request, e.g. docker compose run --rm hades Rscript smoke_eunomia.R.
  # scripts/hades.py opens the tunnel to Redshift and passes the REDSHIFT_* variables.
  hades:
    profiles: ["hades"]
    build:
      context: .
      dockerfile: docker/hades.Dockerfile
    environment:
      REDSHIFT_SERVER: ${REDSHIFT_SERVER:-}
      REDSHIFT_PORT: ${REDSHIFT_PORT:-}
      REDSHIFT_USER: ${REDSHIFT_USER:-}
      REDSHIFT_PASSWORD: ${REDSHIFT_PASSWORD:-}
      CDM_SCHEMA: ${CDM_SCHEMA:-awsdatacatalog.omop_cdm}
    volumes:
      - ./r:/work/r
      - ./data/hades:/work/data/hades
    entrypoint: ["Rscript"]

volumes:
  db:
    name: ehr-rwe-eln-pg18
