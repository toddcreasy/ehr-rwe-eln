[project]
name = "ehr-rwe-eln"
version = "0.1.0"
description = "Real world evidence from synthetic EHR data: OMOP cohorts, target trial emulation, ELN extraction, and data quality checks"
authors = [
    { name = "Todd Creasy", email = "toddcreasy@users.noreply.github.com" }
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "boto3>=1.43.108",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.3",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
infra = [
    "aws-cdk-lib>=2.272.0",
    "constructs>=10.8.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend", "infra/cdk.out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"evals/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["evals: hits a real model; slow and costs money"]
addopts = "-ra"
