[project]
name = "ehr-rwe-eln"
version = "0.1.0"
description = "Real world evidence from synthetic EHR data: OMOP cohorts, target trial emulation, ELN extraction, and data quality checks"
authors = [
    { name = "Todd Creasy", email = "toddcreasy@users.noreply.github.com" }
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=0.125.0",
    "diffprivlib>=0.6.6",
    "fastapi[standard]>=0.142.2",
    "fhir-resources>=8.3.0",
    "lifelines>=0.30.0",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.3",
    "statsmodels>=0.15.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pydantic-evals>=2.54.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"evals/**" = ["S101"]
# The OMOP ETL builds SQL from table and column names defined in code; values are bound.
"src/ehr_rwe_eln/cohort/**" = ["S608"]
# Data quality SQL is built from table, field, and value text in DQD's vendored CSVs.
"src/ehr_rwe_eln/dq/**" = ["S608"]
# Target trial SQL is built from concept set clauses defined in code; values are bound.
"src/ehr_rwe_eln/tte/**" = ["S608"]
# Seeded random synthetic ELN entries, not cryptography.
"src/ehr_rwe_eln/eln/synthetic.py" = ["S311"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["evals: hits a real model; slow and costs money"]
addopts = "-ra"
# lifelines 0.30 uses calls pandas 4 and Python will drop; nothing in our code does.
filterwarnings = [
    "ignore::pandas.errors.Pandas4Warning:lifelines",
    "ignore:datetime.datetime.utcnow:DeprecationWarning:lifelines",
]

[tool.fastapi]
entrypoint = "ehr_rwe_eln.api.main:app"

[tool.uv]
# diffprivlib 0.6.6 imports private scikit-learn names that 1.9 removed. Lift when it catches up.
constraint-dependencies = ["scikit-learn<1.9"]
