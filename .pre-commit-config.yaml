repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
  # Terraform format and lint on staged .tf files; CI's terraform job also runs validate and Trivy.
  - repo: local
    hooks:
      - id: terraform-fmt
        name: terraform fmt
        entry: terraform fmt -check -diff
        language: system
        files: \.tf$
      - id: tflint
        name: tflint
        entry: bash -c 'tflint --recursive --config "$PWD/.tflint.hcl" --chdir infra/terraform'
        language: system
        files: \.tf$
        pass_filenames: false
  # The same scan as CI's secrets job, on the staged changes before each commit.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
