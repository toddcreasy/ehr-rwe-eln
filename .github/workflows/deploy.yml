name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # lets the job request a GitHub OIDC token to assume the AWS role

# One deploy at a time. A newer push waits for the running one instead of cancelling it
# mid-CloudFormation.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::123456789012:role/ehr-rwe-eln-github-actions
  CDK_VERSION: 2.1145.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0 # astral publishes no moving major tag
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: uv sync --locked --group infra
      - run: uv run ruff check .
      - run: uv run pytest
      # Aurora pauses at 0 ACU when idle and takes about 15 s to resume. Parallel eval cases
      # that hit a paused cluster outlast the MCP client's 30 s timeout, so wake it first.
      - name: Wake database
        run: |
          API=$(aws cloudformation describe-stacks --stack-name ehr-rwe-eln-BackendStack \
            --query "Stacks[0].Outputs[?OutputKey=='ApiEndpoint'].OutputValue" --output text)
          curl -sSf --max-time 60 --retry 3 --retry-all-errors "https://$API/health/db"
      - name: Evals
        run: |
          GATEWAY_URL=$(aws cloudformation describe-stacks --stack-name ehr-rwe-eln-AgentStack \
            --query "Stacks[0].Outputs[?OutputKey=='GatewayUrl'].OutputValue" --output text)
          # -rP prints captured logs for passing tests too, so a retried case still shows why.
          GATEWAY_URL=$GATEWAY_URL uv run pytest evals -rP
      # The agent image is arm64 and runners are amd64: emulate arm64 for that build.
      # No setup-buildx-action: its container builder keeps images out of the local daemon,
      # and CDK pushes from the daemon. The default builder plus QEMU handles one platform.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - working-directory: infra
        run: npx --yes aws-cdk@${{ env.CDK_VERSION }} deploy --all --require-approval never
      - run: uv run python scripts/deploy_frontend.py
