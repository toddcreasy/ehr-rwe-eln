name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    # Same image as docker-compose.yml. The password exists only inside this job.
    services:
      db:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_DB: ehr_rwe_eln
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ehr_rwe_eln"
          --health-interval 2s
          --health-retries 30
    env:
      DB_HOST: localhost
      DB_PASSWORD: ci-only
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0 # astral publishes no moving major tag
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  # Secrets, passwords, usernames, and email addresses must never reach the repository. gitleaks
  # scans every commit in the history and every file at this commit with its default rules plus
  # .gitleaks.toml; past findings that cannot be rewritten are listed in .gitleaksignore.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history, not just the merge commit
      - name: Install gitleaks (pinned, checksum verified)
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP" # outside the checkout, so the file scan does not read the binary
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum --check -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan every commit
        run: $RUNNER_TEMP/gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose
      - name: Scan the files at this commit
        run: $RUNNER_TEMP/gitleaks dir . --config .gitleaks.toml --redact --no-banner --verbose
