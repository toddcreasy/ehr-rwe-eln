name: trial_lisinopril_amlodipine_ckd
description: >-
  The analysis table of module 3's lisinopril versus amlodipine trial (CKD stage 3 or worse):
  one row per eligible person, with arm, baseline covariates, follow-up days, and outcome.
  Releases are judged by rerunning the trial's propensity-weighted Cox analysis on them and
  comparing the hazard ratio with the real one. Synthetic Synthea data only; no clinical claims.
protocol: lisinopril_vs_amlodipine_ckd
# Synthea output, no participants. A controlled-access source says controlled here, and
# must then give approved_users (and attack_approval to run the privacy attacks).
source_access: synthetic
data_use_limitations: >-
  None. The source is Synthea output with no participants, so there is no consent and no
  data use limitation. A spec over a controlled-access source copies its data use limitations
  here, word for word from the study's data use certification.
# Judged against the data it learned from, so nothing is held out: the cohort has 26 events.
holdout_fraction: 0
# Fidelity is also reported within each age bin and sex; with no holdout there is no floor.
subgroups: [male, age]
seed: 0
releases:
  - {method: bayes_net, epsilon: 1}
  - {method: bayes_net, epsilon: 4}
  - {method: bayes_net, epsilon: 16}
  # Effectively no privacy: separates what the declared structure loses from what noise loses.
  - {method: bayes_net, epsilon: 1000}
  - {method: vae, epsilon: 4}
  - {method: mst, epsilon: 1}
  - {method: mst, epsilon: 4}
  - {method: aim, epsilon: 1}
  - {method: aim, epsilon: 4}
# 1,890 people: batches of 128 give the VAE more steps per epoch than the default 512.
vae: {batch_size: 128}
# What aim releases are aimed at (every other pair of columns has weight 1): what the
# propensity-weighted Cox analysis reads. Arm with follow-up and outcome; arm with each
# covariate (the propensity model); each covariate with the outcome (confounding).
# Weights fixed before any release.
workload:
  - {columns: [arm, days, event], weight: 5}
  - {columns: [arm, age], weight: 5}
  - {columns: [arm, male], weight: 5}
  - {columns: [arm, obesity], weight: 5}
  - {columns: [arm, diabetes], weight: 5}
  - {columns: [arm, hyperlipidemia], weight: 5}
  - {columns: [arm, ischemic_heart_disease], weight: 5}
  - {columns: [arm, ckd_stage_1_or_2], weight: 5}
  - {columns: [arm, heart_failure], weight: 5}
  - {columns: [arm, systolic_bp], weight: 5}
  - {columns: [arm, egfr], weight: 5}
  - {columns: [arm, bmi], weight: 5}
  - {columns: [arm, hba1c], weight: 5}
  - {columns: [age, event], weight: 5}
  - {columns: [male, event], weight: 5}
  - {columns: [obesity, event], weight: 5}
  - {columns: [diabetes, event], weight: 5}
  - {columns: [hyperlipidemia, event], weight: 5}
  - {columns: [ischemic_heart_disease, event], weight: 5}
  - {columns: [ckd_stage_1_or_2, event], weight: 5}
  - {columns: [heart_failure, event], weight: 5}
  - {columns: [systolic_bp, event], weight: 5}
  - {columns: [egfr, event], weight: 5}
  - {columns: [bmi, event], weight: 5}
  - {columns: [hba1c, event], weight: 5}
columns:
  - {name: age, analysis: age, numeric: {low: 0, high: 100, bins: 10, integer: true, open_top: true}}
  - {name: male, analysis: male, categories: [0, 1]}
  - {name: obesity, analysis: obesity, categories: [0, 1], parents: [age]}
  - {name: diabetes, analysis: diabetes, categories: [0, 1], parents: [age, obesity]}
  - {name: hyperlipidemia, analysis: hyperlipidemia, categories: [0, 1], parents: [age]}
  - name: ischemic_heart_disease
    analysis: ischemic_heart_disease
    categories: [0, 1]
    parents: [age, hyperlipidemia]
  - name: ckd_stage_1_or_2
    analysis: ckd_stage_1_or_2
    categories: [0, 1]
    parents: [age, diabetes]
  - name: heart_failure
    analysis: heart_failure
    categories: [0, 1]
    parents: [age, ischemic_heart_disease]
  # Measurement covariates: the latest value in the lookback window, or missing.
  - name: systolic_bp
    analysis: systolic_bp
    numeric: {low: 70, high: 190, bins: 12}
    allow_missing: true
    parents: [age]
  - name: egfr
    analysis: egfr
    numeric: {low: 0, high: 150, bins: 10}
    allow_missing: true
    parents: [ckd_stage_1_or_2]
  - name: bmi
    analysis: bmi
    numeric: {low: 10, high: 60, bins: 10}
    allow_missing: true
    parents: [obesity]
  - name: hba1c
    analysis: hba1c
    numeric: {low: 2, high: 12, bins: 10}
    allow_missing: true
    parents: [diabetes]
  # Treatment: ACE inhibitors such as lisinopril are the usual choice with diabetes or kidney
  # disease (public prescribing guidance), so those are the confounders the network keeps.
  - {name: arm, analysis: arm, categories: [0, 1], parents: [diabetes, ckd_stage_1_or_2]}
  # Follow-up days, capped at the protocol's 1825.
  - {name: days, analysis: days, numeric: {low: 1, high: 1826, bins: 10, integer: true}, parents: [age]}
  # The outcome depends on the arm (the effect being estimated) and on how long follow-up ran.
  - {name: event, analysis: event, categories: [0, 1], parents: [arm, days]}
