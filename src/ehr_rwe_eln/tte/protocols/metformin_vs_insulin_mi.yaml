id: 2
name: metformin_vs_insulin_mi
description: >-
  Emulates a trial of starting metformin versus starting insulin as the first diabetes drug for
  adults with newly diagnosed type 2 diabetes, followed for myocardial infarction. Demonstration on synthetic Synthea data only; no clinical claims.
eligibility:
  diagnosis:
    # Type 2 diabetes, or a condition recorded as due to it. Synthea writes no diabetes code for
    # many patients whose diabetes shows only as kidney complications; those still count.
    # 201826 type 2 diabetes mellitus, 192279 disorder of kidney due to diabetes mellitus,
    # 45769905 microalbuminuria due to T2DM, 45757499 proteinuria due to T2DM.
    concept_ids: [201826, 192279, 45769905, 45757499]
  max_days_from_diagnosis: 365
  min_age: 18
  prior_observation_days: 365
strategies:
  treatment:
    name: metformin
    drugs:
      concept_ids: [1503297] # metformin (RxNorm ingredient), with every product containing it
  comparator:
    name: insulin
    drugs:
      # insulin regular human, insulin isophane, insulin lispro: the insulins Synthea prescribes
      concept_ids: [1596977, 46221581, 1550023]
outcome:
  name: myocardial_infarction
  conditions:
    concept_ids: [4329847] # myocardial infarction, with STEMI and NSTEMI below it
follow_up:
  max_days: 1825
causal_contrast: intention_to_treat
covariates:
  conditions:
    - {name: hypertension, conditions: {concept_ids: [320128]}}
    - {name: hyperlipidemia, conditions: {concept_ids: [432867]}}
    - {name: obesity, conditions: {concept_ids: [4060985]}} # body mass index 30+
    - {name: ischemic_heart_disease, conditions: {concept_ids: [4185932]}}
    - {name: ckd_stage_1_or_2, conditions: {concept_ids: [443614, 443601]}}
    - {name: diabetic_kidney_disorder, conditions: {concept_ids: [192279]}}
    - {name: heart_failure, conditions: {concept_ids: [4229440]}}
  measurements:
    - {name: hba1c, measurements: {concept_ids: [3004410]}} # hemoglobin A1c, percent
    - {name: egfr, measurements: {concept_ids: [46236952]}} # MDRD, mL/min/1.73 m2
    - {name: bmi, measurements: {concept_ids: [3038553]}}
analysis:
  truncate_percentile: 1
