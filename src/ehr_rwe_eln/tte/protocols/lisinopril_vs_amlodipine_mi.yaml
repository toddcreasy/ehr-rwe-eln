id: 4
name: lisinopril_vs_amlodipine_mi
description: >-
  Emulates a trial of starting lisinopril (an ACE inhibitor) versus amlodipine (a calcium
  channel blocker) as the first drug for adults with newly diagnosed essential hypertension,
  followed for myocardial infarction. ALLHAT compared these drug classes. Demonstration on synthetic
  Synthea data only; no clinical claims.
eligibility:
  diagnosis:
    concept_ids: [320128] # essential hypertension
  max_days_from_diagnosis: 365
  min_age: 18
  prior_observation_days: 365
strategies:
  treatment:
    name: lisinopril
    drugs:
      concept_ids: [1308216] # lisinopril (RxNorm ingredient), with every product containing it
  comparator:
    name: amlodipine
    drugs:
      concept_ids: [1332418] # amlodipine (RxNorm ingredient), with every product containing it
outcome:
  name: myocardial_infarction
  conditions:
    concept_ids: [4329847] # myocardial infarction, with STEMI and NSTEMI below it
follow_up:
  max_days: 1825
causal_contrast: intention_to_treat
covariates:
  conditions:
    # type 2 diabetes, or a condition recorded as due to it (see the metformin protocols)
    - {name: diabetes, conditions: {concept_ids: [201826, 192279, 45769905, 45757499]}}
    - {name: hyperlipidemia, conditions: {concept_ids: [432867]}}
    - {name: obesity, conditions: {concept_ids: [4060985]}} # body mass index 30+
    - {name: ischemic_heart_disease, conditions: {concept_ids: [4185932]}}
    - {name: ckd_stage_1_or_2, conditions: {concept_ids: [443614, 443601]}}
    - {name: heart_failure, conditions: {concept_ids: [4229440]}}
  measurements:
    - {name: systolic_bp, measurements: {concept_ids: [3004249]}, missing_indicator: vitals_missing} # mmHg
    - {name: egfr, measurements: {concept_ids: [46236952]}} # MDRD, mL/min/1.73 m2
    - {name: bmi, measurements: {concept_ids: [3038553]}, missing_indicator: vitals_missing}
    - {name: hba1c, measurements: {concept_ids: [3004410]}} # hemoglobin A1c, percent
analysis:
  truncate_percentile: 1
negative_controls:
  # Neither drug plausibly causes these, chosen 2026-11-20 from the conditions with new cases in
  # both arms (scripts/negative_control_candidates.py). Avoided: gum and dental conditions
  # (amlodipine causes gum overgrowth, which traps plaque), cough and taste changes (ACE
  # inhibitors), falls and the injuries they cause (any blood pressure drug can cause dizziness),
  # pregnancy (ACE inhibitors are avoided in it), the indication and its complications, and
  # conditions with a published link to either drug (anemia, pneumonia, dementia, COVID-19).
  - {name: viral_sinusitis, conditions: {concept_ids: [40481087]}}
  - {name: acute_bacterial_sinusitis, conditions: {concept_ids: [4294548]}}
  - {name: chronic_sinusitis, conditions: {concept_ids: [257012]}}
  - {name: viral_pharyngitis, conditions: {concept_ids: [4112343]}}
  - {name: strep_throat, conditions: {concept_ids: [28060]}}
  - {name: acute_bronchitis, conditions: {concept_ids: [260139]}}
  - {name: otitis_media, conditions: {concept_ids: [372328]}}
  - {name: cystitis, conditions: {concept_ids: [4144035]}} # acute infective cystitis
  - {name: colon_polyp, conditions: {concept_ids: [4285898]}}
  - {name: partial_thickness_burn, conditions: {concept_ids: [4296205]}}
  - {name: epidermal_burn, conditions: {concept_ids: [4296204]}}
  - {name: whiplash, conditions: {concept_ids: [4218389]}} # mostly road traffic, not falls
