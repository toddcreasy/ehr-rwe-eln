# The ACMG/AMP criteria that data alone can decide, as each gene's ClinGen expert panel (VCEP)
# specified them. Thresholds are transcribed from the ClinGen Criteria Specification (CSpec)
# registry, https://cspec.genome.network, read 2026-11-19; each gene names its document.
#
# Measures, all gnomAD v4 with exomes and genomes joined:
#   faf95      filtering allele frequency: the 95% lower bound of the frequency in the
#              non-bottlenecked ancestry group where it is highest ("GroupMax FAF")
#   grpmax_af  the frequency in the non-bottlenecked ancestry group where it is highest
#   af         the overall frequency
#   absent     no call at the site, or an allele count of 0
# A variant gnomAD has no call for counts as frequency 0 for the "rare" criteria.
#
# Band bounds: above (>), at_least (>=), below (<), at_most (<=); ac_above and ac_at_most
# limit the allele count.
#
# PVS1 (see rules.py), by the first that is set:
#   pvs1_table: enigma   ENIGMA's Specifications Table 4, per exon and per splice-site change
#                        (enigma_pvs1.yaml, from scripts/import_enigma_pvs1.py)
#   ptc_codons           cut-offs on the codon of the premature stop
#   ptc_window           codons where a truncation counts whatever its exon
# otherwise the NMD rule. splice_to_curator leaves canonical splice sites to the curator.

genes:
  BRCA1:
    panel: ENIGMA BRCA1 and BRCA2 Variant Curation Expert Panel
    cspec: GN092
    version: "1.2"
    ba1:
      - {strength: stand_alone, measure: faf95, above: 0.001}
    bs1:
      - {strength: strong, measure: faf95, above: 0.0001}
      - {strength: supporting, measure: faf95, above: 0.00002, at_most: 0.0001}
    pm2:
      - {strength: supporting, measure: absent}
    pvs1_table: enigma
    notes: >-
      The panel reads gnomAD v2.1 and v3.1 non-cancer subsets and requires read depth of at
      least 25 for PM2; this uses gnomAD v4 joined and does not check depth. PVS1 and PM5_PTC
      come from the panel's Specifications Table 4 (v1.2); splice-site changes it does not
      list, and deletions or duplications, are left to the curator.
  BRCA2:
    panel: ENIGMA BRCA1 and BRCA2 Variant Curation Expert Panel
    cspec: GN097
    version: "1.2"
    ba1:
      - {strength: stand_alone, measure: faf95, above: 0.001}
    bs1:
      - {strength: strong, measure: faf95, above: 0.0001}
      - {strength: supporting, measure: faf95, above: 0.00002, at_most: 0.0001}
    pm2:
      - {strength: supporting, measure: absent}
    pvs1_table: enigma
    notes: >-
      As BRCA1.
  MLH1:
    panel: InSiGHT Hereditary Colorectal Cancer/Polyposis Variant Curation Expert Panel
    cspec: GN115
    version: "2.0"
    ba1:
      - {strength: stand_alone, measure: faf95, at_least: 0.001}
    bs1:
      - {strength: strong, measure: faf95, at_least: 0.0001, below: 0.001}
    pm2:
      - {strength: supporting, measure: af, below: 0.00002}
    ptc_codons:
      - {strength: very_strong, at_most: 753}
      - {strength: moderate, at_least: 754, at_most: 756}
    notes: >-
      BA1 and BS1 exclude known founder pathogenic variants; this does not.
  MSH2:
    panel: InSiGHT Hereditary Colorectal Cancer/Polyposis Variant Curation Expert Panel
    cspec: GN137
    version: "2.0"
    ba1:
      - {strength: stand_alone, measure: faf95, at_least: 0.001}
    bs1:
      - {strength: strong, measure: faf95, at_least: 0.0001, below: 0.001}
    pm2:
      - {strength: supporting, measure: af, below: 0.00002}
    ptc_codons:
      - {strength: very_strong, at_most: 891}
      - {strength: moderate, at_least: 892, at_most: 934}
    notes: >-
      BA1 and BS1 exclude known founder pathogenic variants; this does not.
  APC:
    panel: InSiGHT Hereditary Colorectal Cancer/Polyposis Variant Curation Expert Panel
    cspec: GN089
    version: "2.1"
    ba1:
      - {strength: stand_alone, measure: faf95, at_least: 0.001}
    bs1:
      - {strength: strong, measure: faf95, at_least: 0.00001}
    pm2:
      - {strength: supporting, measure: af, at_most: 0.000003, ac_above: 1}
      - {strength: supporting, measure: af, below: 0.00001, ac_at_most: 1}
    # Spier et al. 2024, Genet Med 26:100992 (doi:10.1016/j.gim.2023.100992): the last exon
    # (codons 653 to 2843) escapes NMD but truncations there cause FAP, so NMD does not decide
    # PVS1. Its boundaries are the 5'-most and 3'-most truncations the panel could classify
    # likely pathogenic: p.(Lys49AsnfsTer20) and p.(Tyr2645LysfsTer14). Canonical splice sites
    # are graded by lists A to E in its supplement, not encoded here.
    ptc_window: {first: 49, last: 2645}
    splice_to_curator: true
    notes: >-
      PM2's allele frequency is read as the overall frequency. Splice sites, initiation codon
      variants, and deletions are left to the curator.
  LDLR:
    panel: Familial Hypercholesterolemia Variant Curation Expert Panel
    cspec: GN013
    version: "1.2"
    ba1:
      - {strength: stand_alone, measure: faf95, at_least: 0.005}
    bs1:
      - {strength: strong, measure: faf95, at_least: 0.002}
    pm2:
      - {strength: moderate, measure: grpmax_af, at_most: 0.0002}
    notes: >-
      PM2 is Moderate for LDLR, not Supporting. The panel's PVS1 flow diagram is applied only
      as far as NMD; founder variants are not excepted from PM2.
